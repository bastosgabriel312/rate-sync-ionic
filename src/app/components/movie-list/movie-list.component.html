@if (movies.length > 0 && !isLoading) {
  <ion-list>
    @for (movie of movies; track movie) {
      <app-movie-item [movie]="movie" [isLoading]="isLoadingReviews(movie.title)" [reviews]="getReviews(movie.title)" (requestReviews)="requestReviews($event)"></app-movie-item>
    }
  </ion-list>
}

@if (isLoading) {
  <ion-list>
    @for (item of skeletonItems; track item) {
      <app-movie-item-skeleton/>
    }
  </ion-list>
}
