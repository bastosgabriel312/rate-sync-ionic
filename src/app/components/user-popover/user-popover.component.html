<ion-content class="ion-padding">
  <ion-content>
    <ion-list>
      <ion-item>
        <ion-label>
          <h3>{{ userName }}</h3>
          <p>{{ userEmail }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
  <ion-button (click)="goToProfile()" expand="block" fill="clear">
    Perfil
  </ion-button>
  <ion-button (click)="logout()" expand="block" fill="clear">
    Sair
  </ion-button>
</ion-content>
